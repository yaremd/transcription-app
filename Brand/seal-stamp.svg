    <circle cx="79" cy="79" r="10" fill="#C9503C"/>
    <circle cx="105" cy="64" r="10" fill="#C9503C"/>
    <circle cx="135" cy="64" r="10" fill="#C9503C"/>
    <circle cx="161" cy="79" r="10" fill="#C9503C"/>
    <circle cx="176" cy="105" r="10" fill="#C9503C"/>
