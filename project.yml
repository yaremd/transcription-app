name: LocalScribe
options:
  bundleIdPrefix: com.yarem
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.1.6
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.1.0"
settings:
  base:
    MARKETING_VERSION: "0.24"
    CURRENT_PROJECT_VERSION: "24"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "S4M9R72TXR"
    ENABLE_HARDENED_RUNTIME: "YES"
targets:
  LocalScribe:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Support/Assets.xcassets
    dependencies:
      - package: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: Sparkle
        product: Sparkle
      - package: FluidAudio
    info:
      path: Support/Info.plist
      properties:
        # XcodeGen writes its own defaults (1.0 / 1) for these unless they are
        # declared here, so point them at the build settings above. Sparkle
        # compares CFBundleVersion against sparkle:version in docs/appcast.xml —
        # without this, every build reports 1 and no update is ever offered.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Seal listens to your microphone to transcribe your side of the conversation, entirely on your Mac."
        NSAudioCaptureUsageDescription: "Seal captures your Mac's audio output to transcribe the other side of a call, entirely on your Mac."
        NSCalendarsFullAccessUsageDescription: "Seal reads your calendar only to name a recording after its meeting and list who was invited. Nothing leaves your Mac."
        LSApplicationCategoryType: "public.app-category.productivity"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle auto-update. The appcast lives on GitHub Pages behind the
        # sealformac.com custom domain; the old yaremd.github.io URL
        # 301-redirects there, so builds that shipped with the old URL
        # (v0.18 and earlier) keep updating.
        SUFeedURL: "https://sealformac.com/appcast.xml"
        SUPublicEDKey: "C4hPB3oc/f+P3F6YEGgmdi7ay++/H5HpggNdv5cI50M="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yarem.Seal
        PRODUCT_NAME: Seal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Names Support/Assets.xcassets/AppIcon.appiconset, which carries
        # DIFFERENT art per size: the mascot where there is room for a face, the
        # mark's small cut at 32 px and below. That is the whole reason it is an
        # icon set and not the layered Seal.icon it replaced — a layered icon is
        # one composition scaled, and the mascot does not survive 16 px.
        # Regenerate with: swift Brand/gen-seal-mark.swift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hardened Runtime needs the microphone declared for a notarized build to
        # be granted mic access at runtime. Minimal, non-sandboxed (see the file).
        CODE_SIGN_ENTITLEMENTS: Support/Seal.entitlements
    scheme:
      testTargets:
        - LocalScribeTests
  LocalScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: LocalScribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yarem.SealTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Seal.app/Contents/MacOS/Seal"
        BUNDLE_LOADER: "$(TEST_HOST)"
