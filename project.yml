name: LocalScribe
options:
  bundleIdPrefix: com.yarem
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.1.6
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "S4M9R72TXR"
    ENABLE_HARDENED_RUNTIME: "YES"
targets:
  LocalScribe:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Support/Assets.xcassets
    dependencies:
      - package: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: Sparkle
        product: Sparkle
    info:
      path: Support/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Seal listens to your microphone to transcribe your side of the conversation, entirely on your Mac."
        LSApplicationCategoryType: "public.app-category.productivity"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle auto-update. Replace both placeholders before release:
        #   SUFeedURL     → your GitHub Pages appcast URL
        #   SUPublicEDKey → the public key printed by Sparkle's generate_keys
        SUFeedURL: "https://CHANGE-ME.github.io/seal/appcast.xml"
        SUPublicEDKey: "REPLACE_WITH_SPARKLE_PUBLIC_KEY"
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yarem.LocalScribe
        PRODUCT_NAME: Seal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - LocalScribeTests
  LocalScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: LocalScribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yarem.LocalScribeTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Seal.app/Contents/MacOS/Seal"
        BUNDLE_LOADER: "$(TEST_HOST)"
