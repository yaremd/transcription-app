<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Seal, pressed in wax">
  <!-- Wax-stamp lockup: soft scalloped wax + pressed field + embossed face.
       The face is the SMALL cut (no whiskers) — a real wax impression carries
       only the shapes deep enough to survive the press, and the whiskers are
       far too fine to emboss. Wax red stays deliberately NOT Theme.red: a red
       dot means recording is live, wax means sealed and saved. Never swap them. -->
  <g>
    <circle cx="176" cy="135" r="10" fill="#C9503C"/>
    <circle cx="161" cy="161" r="10" fill="#C9503C"/>
    <circle cx="135" cy="176" r="10" fill="#C9503C"/>
