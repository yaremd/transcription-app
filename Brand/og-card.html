<!doctype html>
<!-- The link-preview card for sealformac.com (docs/og.png, 1200x630). Render it from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=docs/og.png "file://$PWD/Brand/og-card.html"
     It uses the app icon and the site's own screenshot, so re-render it when either changes. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400..600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#04110D;}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Instrument Sans",sans-serif;color:#EAF2E6;
 background:radial-gradient(520px 380px at 900px 520px, rgba(211,243,107,.18), transparent 70%), radial-gradient(600px 420px at 1160px -40px, rgba(30,92,70,.6), transparent 70%), radial-gradient(500px 400px at -60px 240px, rgba(20,81,60,.35), transparent 70%), #04110D;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(234,242,230,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(234,242,230,.08) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 80% at 30% 30%,#000 25%,transparent 75%);opacity:.6}
.halo{position:absolute;left:600px;top:250px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at 32% 25%, rgba(211,243,107,.12), transparent 56%), rgba(10,42,33,.5);box-shadow:inset 0 0 0 1.5px rgba(211,243,107,.32), 0 0 120px rgba(211,243,107,.16)}
.halo:before{content:"";position:absolute;inset:-1px;border-radius:50%;padding:2px;background:conic-gradient(from 230deg, transparent 0deg, rgba(211,243,107,.95) 60deg, transparent 140deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor}
.shot{position:absolute;left:640px;top:300px;width:620px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(211,243,107,.4))}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-weight:650;font-size:32px;letter-spacing:-.01em}
.brand img{width:58px;height:58px;filter:drop-shadow(0 0 1px rgba(211,243,107,.5)) drop-shadow(0 6px 14px rgba(0,0,0,.5))}
h1{position:absolute;left:72px;top:150px;width:600px;margin:0;font-weight:600;font-stretch:90%;font-size:76px;line-height:.98;letter-spacing:-.045em}
h1 em{font-style:normal;color:#D3F36B;text-shadow:0 0 30px rgba(211,243,107,.35)}
.meta{position:absolute;left:72px;bottom:64px;font:500 20px "JetBrains Mono",monospace;color:#8EA196;letter-spacing:.02em}
.meta b{color:#D3F36B;font-weight:600}
.tag{position:absolute;left:880px;top:200px;font:500 17px "JetBrains Mono",monospace;color:#BFCDC4;background:rgba(6,22,15,.8);padding:10px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(234,242,230,.15)}
.tag b{color:#D3F36B}
</style></head><body><div class="card"><div class="grid"></div><div class="halo"></div>
<img class="shot" src="../docs/assets/saved.webp">
<div class="tag">meetings sent · <b>0 B</b></div>
<div class="brand"><img src="../Support/Assets.xcassets/AppIcon.appiconset/icon_512.png" alt="">Seal</div>
<h1>Meeting notes that <em>never leave</em> your Mac.</h1>
<div class="meta">100% on-device · free · <b>sealformac.com</b></div>
</div></body></html>
